<!DOCTYPE html>
<html>
<head>
    <title>Search History - WoW Character Dashboard</title>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }
        .nav {
            margin-bottom: 30px;
        }
        .nav a {
            color: #60a5fa;
            text-decoration: none;
            margin: 0 15px;
            padding: 10px;
            border-radius: 5px;
        }
        .nav a:hover {
            background-color: #1e293b;
        }
        .card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            padding: 30px;
            margin: 20px auto;
            width: 600px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .history-item {
            background-color: rgba(255,255,255,0.05);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            text-align: left;
        }
        .search-btn {
            background-color: #60a5fa;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        .search-btn:hover {
            background-color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/stats">Stats Guide</a>
        <a href="/guild">Guild Lookup</a>
        <a href="/history">Search History</a>
    </div>

    <h1>Search History</h1>

    <div class="card">
        <h2>Recent Searches</h2>
        <p>Search history feature coming soon! This page will show your recently searched characters.</p>

        <div class="history-item">
            <strong>Example:</strong> Character search history will appear here
            <br><small>Last searched: Just now</small>
        </div>

        <h2>Quick Search</h2>
        <form action="/" method="POST" style="margin-top: 20px;">
            <input name="name" placeholder="Character Name" required style="padding: 10px; margin: 5px;">
            <input name="realm" placeholder="Realm" required style="padding: 10px; margin: 5px;">
            <br>
            <button type="submit" class="search-btn">Search Character</button>
        </form>
    </div>
</body>
</html>
